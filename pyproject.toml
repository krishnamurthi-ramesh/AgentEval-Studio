[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agenteval-studio"
version = "0.1.0"
description = "The collaborative evaluation workspace for AI builders — ChatPRD for AI Evals"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Krishnamurthi Ramesh" }]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "streamlit>=1.35.0",
]

[project.scripts]
agenteval = "agenteval.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agenteval*"]

